            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --primary: #6366f1;
            --primary-light: #e0e7ff;
            --primary-hover: #4f46e5;
            
            --asset-color: #10b981;
            --asset-bg: #ecfdf5;
            --liability-color: #f97316;
            --liability-bg: #fff7ed;
            --equity-color: #8b5cf6;
            --equity-bg: #f5f3ff;
            --income-color: #06b6d4;
            --income-bg: #ecfeff;
            --expense-color: #ef4444;
            --expense-bg: #fef2f2;
            
            --transition-speed: 0.25s;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
        }

        [data-theme="dark"] {
            --bg-primary: #0b0f19;
            --bg-card: #151b2a;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --primary: #818cf8;
            --primary-light: #1e1b4b;
            --primary-hover: #6366f1;
            
            --asset-bg: #022c22;
            --liability-bg: #2c1605;
            --equity-bg: #1e113a;
            --income-bg: #082f49;
            --expense-bg: #3b0712;
            
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] header {
            background-color: rgba(21, 27, 42, 0.8);
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-speed);
        }

        .theme-btn:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: all var(--transition-speed);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
        }

        .stat-item.asset { background-color: var(--asset-bg); color: var(--asset-color); }
        .stat-item.liability { background-color: var(--liability-bg); color: var(--liability-color); }
        .stat-item.equity { background-color: var(--equity-bg); color: var(--equity-color); }
        .stat-item.income { background-color: var(--income-bg); color: var(--income-color); }
        .stat-item.expense { background-color: var(--expense-bg); color: var(--expense-color); }

        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .category-group {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow var(--transition-speed);
        }

        .category-group:hover {
            box-shadow: var(--shadow-md);
        }

        .category-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .category-header.asset { border-left: 4px solid var(--asset-color); }
        .category-header.liability { border-left: 4px solid var(--liability-color); }
        .category-header.equity { border-left: 4px solid var(--equity-color); }
        .category-header.income { border-left: 4px solid var(--income-color); }
        .category-header.expense { border-left: 4px solid var(--expense-color); }

        .category-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-header.asset .category-title { color: var(--asset-color); }
        .category-header.liability .category-title { color: var(--liability-color); }
        .category-header.equity .category-title { color: var(--equity-color); }
        .category-header.income .category-title { color: var(--income-color); }
        .category-header.expense .category-title { color: var(--expense-color); }

            font-size: 11px;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            border: 1px solid var(--border-color);
        }

        .category-content {
            padding: 10px 0;
        }

        .tree-node {
            list-style: none;
        }

        .node-row {
            display: flex;
            align-items: center;
            padding: 8px 24px;
            position: relative;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .node-row:hover {
            background-color: var(--bg-primary);
        }

        .node-indent {
            display: flex;
            align-items: center;
        }

        .indent-bar {
            width: 24px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .expand-toggle {
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-secondary);
            transition: background-color var(--transition-speed);
            margin-right: 6px;
        }

        .expand-toggle:hover {
            background-color: var(--border-color);
        }

        .node-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .node-icon.folder { color: #f59e0b; }
        .node-icon.file { color: #3b82f6; }

        .node-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
            margin-right: 12px;
            font-weight: 500;
            width: 44px;
            flex-shrink: 0;
        }

        .node-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-badges {
            display: flex;
            gap: 6px;
            margin-left: 12px;
        }

        .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge.protected {
            background-color: #fffbeb;
            color: #b45309;
            border: 1px solid #fef3c7;
        }
        [data-theme="dark"] .badge.protected {
            background-color: #78350f;
            color: #fef3c7;
            border: none;
        }

        .badge.inactive {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }
        [data-theme="dark"] .badge.inactive {
            background-color: #374151;
            color: #d1d5db;
            border: none;
        }

        .node-children {
            margin: 0;
            padding: 0;
            display: block;
        }

        .node-children.collapsed {
            display: none;
        }

        .highlight {
            background-color: rgba(253, 224, 71, 0.4);
            color: #854d0e;
            padding: 2px 4px;
            border-radius: 2px;
        }

        [data-theme="dark"] .highlight {
            background-color: rgba(234, 179, 8, 0.3);
            color: #fef08a;
        }
    </style>
</head>

        <div class="content-area" id="contentArea"></div>
    </main>

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');

        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                updateThemeIcon(false);
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                updateThemeIcon(true);
            }
        });

        function updateThemeIcon(isDark) {
            themeIcon.innerHTML = isDark 
                ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
                : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        }

        // Build hierarchy tree
        function buildTree(accounts) {
            const nodeMap = new Map();
            accounts.forEach(acc => {
                nodeMap.set(acc.id, { ...acc, children: [] });
            });

            const roots = [];
            nodeMap.forEach(node => {
                if (node.parent_id && nodeMap.has(node.parent_id)) {
                    nodeMap.get(node.parent_id).children.push(node);
                } else {
                    roots.push(node);
                }
            });

            // Sort by code
            const sortNodes = (nodes) => {
                nodes.sort((a, b) => a.code.localeCompare(b.code));
                nodes.forEach(n => sortNodes(n.children));
            };
            sortNodes(roots);

            return roots;
        }

        const treeRoots = buildTree(rawAccounts);

        // Update stats summary count
        function updateStats(accounts) {
            const counts = { ASSET: 0, LIABILITY: 0, EQUITY: 0, INCOME: 0, EXPENSE: 0 };
            accounts.forEach(acc => {
                if (counts[acc.type]) counts[acc.type]++;
            });

            statsList.innerHTML = Object.entries(counts).map(([type, count]) => {
                const lower = type.toLowerCase();
                return `
                    <div class="stat-item ${lower}">
                        <span>${type} Accounts</span>
                        <span class="stat-val">${count}</span>
                    </div>
                `;
            }).join('');
        }

        updateStats(rawAccounts);

        // Generate tree markup
        function renderTree(roots) {
            const types = ["ASSET", "LIABILITY", "EQUITY", "INCOME", "EXPENSE"];
            contentArea.innerHTML = '';

            types.forEach(type => {
                const categoryRoots = roots.filter(r => r.type === type);
                if (categoryRoots.length === 0) return;

                const categoryContainer = document.createElement('div');
                categoryContainer.className = 'category-group';
                
                const header = document.createElement('div');
                header.className = `category-header ${type.toLowerCase()}`;
                header.innerHTML = `
                    <div class="category-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4c0-.5.2-1 .6-1.4C5 2.2 5.5 2 6 2h12c.5 0 1 .2 1.4.6.4.4.6.9.6 1.4v18l-4-2-4 2-4-2-4 2z"/></svg>
                        ${type}
                    </div>
                    <div class="category-badge">${countAllChildren(categoryRoots)} Accounts</div>
                `;
                categoryContainer.appendChild(header);

                const content = document.createElement('div');
                content.className = 'category-content';
                
                const ul = document.createElement('ul');
                ul.style.paddingLeft = '0';
                categoryRoots.forEach(node => {
                    ul.appendChild(createNodeEl(node, 0));
                });
                content.appendChild(ul);
                categoryContainer.appendChild(content);

                contentArea.appendChild(categoryContainer);
            });
        }

        function countAllChildren(nodes) {
            let count = nodes.length;
            nodes.forEach(n => {
                count += countAllChildren(n.children);
            });
            return count;
        }

        function highlightMatch(text, query) {
            if (!query) return text;
            const index = text.toLowerCase().indexOf(query.toLowerCase());
            if (index === -1) return text;
            return text.substring(0, index) + 
                `<span class="highlight">${text.substring(index, index + query.length)}</span>` + 
                text.substring(index + query.length);
        }

        function matchesSearch(node, query) {
            if (!query) return false;
            const q = query.toLowerCase();
            return node.name.toLowerCase().includes(q) || node.code.toLowerCase().includes(q);
        }

        function hasMatchingDescendant(node, query) {
            if (!query) return false;
            return node.children.some(c => matchesSearch(c, query) || hasMatchingDescendant(c, query));
        }

        function createNodeEl(node, level) {
            const li = document.createElement('li');
            li.className = 'tree-node';
            li.id = `node-${node.id}`;

            const hasChildren = node.children.length > 0;
            const isExpanded = expandedNodes.has(node.id);

            const row = document.createElement('div');
            row.className = 'node-row';
            row.style.paddingLeft = `${level * 24 + 20}px`;
            
            // Expand toggle button
            let toggleHtml = '<span class="expand-toggle" style="visibility: hidden"></span>';
            if (hasChildren) {
                toggleHtml = `
                    <span class="expand-toggle">
                        ${isExpanded ? 
                            '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>' : 
                            '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>'
                        }
                    </span>
                `;
            }

            const iconHtml = hasChildren 
                ? (isExpanded 
                    ? '<svg class="node-icon folder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>'
                    : '<svg class="node-icon folder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>')
                : '<svg class="node-icon file" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>';

            let badgesHtml = '';
            if (node.is_protected) {
                badgesHtml += '<span class="badge protected">🔒 Protected</span>';
            }
            if (node.is_active === 0) {
                badgesHtml += '<span class="badge inactive">Inactive</span>';
            }

            const codeMatch = searchFilter ? highlightMatch(node.code, searchFilter) : node.code;
            const nameMatch = searchFilter ? highlightMatch(node.name, searchFilter) : node.name;

            row.innerHTML = `
                ${toggleHtml}
                ${iconHtml}
                <span class="node-code">${codeMatch}</span>
                <span class="node-name">${nameMatch}</span>
                <div class="node-badges">${badgesHtml}</div>
            `;

            // Row click event
            row.addEventListener('click', (e) => {
                if (hasChildren && (e.target.closest('.expand-toggle') || !e.target.closest('.expand-toggle'))) {
                    if (expandedNodes.has(node.id)) {
                        expandedNodes.delete(node.id);
                    } else {
                        expandedNodes.add(node.id);
                    }
                    refreshTree();
                }
            });

            li.appendChild(row);

            // Render child nodes if expanded or if matching descendants exist during search
            const shouldShowChildren = hasChildren && (isExpanded || (searchFilter && hasMatchingDescendant(node, searchFilter)));
            if (shouldShowChildren) {
                const subUl = document.createElement('ul');
                subUl.className = 'node-children';
                node.children.forEach(child => {
                    subUl.appendChild(createNodeEl(child, level + 1));
                });
                li.appendChild(subUl);
            }

            // Hide node if it doesn't match search filter and has no matching descendants
            if (searchFilter && !matchesSearch(node, searchFilter) && !hasMatchingDescendant(node, searchFilter)) {
                li.style.display = 'none';
            }

            return li;
        }

        function refreshTree() {
            renderTree(treeRoots);
        }

        // Initial render
        refreshTree();

        // Search trigger
        searchInput.addEventListener('input', (e) => {
            searchFilter = e.target.value;
            refreshTree();
        });

        // Expand/Collapse events
        expandAllBtn.addEventListener('click', () => {
            const collectParentIds = (nodes) => {
                nodes.forEach(n => {
                    if (n.children.length > 0) {
                        expandedNodes.add(n.id);
                        collectParentIds(n.children);
                    }
                });
            };
            collectParentIds(treeRoots);
            refreshTree();
        });

        collapseAllBtn.addEventListener('click', () => {
            expandedNodes.clear();
            refreshTree();
        });
    </script>
</body>
</html>
